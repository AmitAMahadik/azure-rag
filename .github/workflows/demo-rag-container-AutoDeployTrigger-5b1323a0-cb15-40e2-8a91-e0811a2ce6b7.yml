name: Trigger auto deployment for demo-rag-container

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/demo-rag-container-AutoDeployTrigger-5b1323a0-cb15-40e2-8a91-e0811a2ce6b7.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.DEMORAGCONTAINER_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.DEMORAGCONTAINER_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.DEMORAGCONTAINER_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: 
          registryUsername: ${{ secrets.DEMORAGCONTAINER_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.DEMORAGCONTAINER_REGISTRY_PASSWORD }}
          containerAppName: demo-rag-container
          resourceGroup: demo-container
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


